<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCK Login</title>
    <style>
        body {
            background-color: #f1f5f9;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-box {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo {
            margin-top: 15px;
            margin-bottom: -30px;
        }

        .logo img {
            height: 80px;
            max-width: 100%;
        }

        h2 {
            margin-bottom: 25px;
            font-weight: bold;
            color: #333;
            font-size: 1.8rem;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 16px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
        }

        .input-group.password input {
            padding-right: 45px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #777;
            box-shadow: 0 0 5px rgba(119, 119, 119, 0.4);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 14px;
            color: #666;
            transition: color 0.3s;
            user-select: none;
        }

        .toggle-password:hover {
            color: #333;
        }

        .forgot-password {
            display: block;
            text-align: left;
            margin-bottom: 25px;
            font-size: 14px;
            color: #666;
            transition: color 0.3s;
            text-decoration: none;
        }

        .forgot-password:hover {
            color: #000;
        }

        .login-btn {
            background-color: #555;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            transition: background-color 0.3s;
        }

        .login-btn:hover {
            background-color: #444;
        }

        .signup {
            margin-top: 20px;
            font-size: 14px;
        }

        .signup a {
            color: #000;
            text-decoration: none;
            transition: color 0.3s;
        }

        .signup a:hover {
            color: #444;
        }

        .footer-right {
            text-align: center;
            font-size: 12px;
            color: #777;
            margin-top: 20px;
        }

        .alert {
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .alert.error {
            background-color: #ffe5e5;
            color: #b30000;
            border: 1px solid #ffcccc;
        }

        .alert.success {
            background-color: #e6ffed;
            color: #006622;
            border: 1px solid #b3ffcc;
        }

        .alert:hover {
            filter: brightness(0.98);
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .login-box {
                padding: 30px;
            }
            h2 {
                font-size: 1.5rem;
            }
            .input-group input, .login-btn {
                font-size: 14px;
                padding: 14px;
            }
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 20px;
            }
            h2 {
                font-size: 1.3rem;
            }
            .logo img {
                height: 60px;
            }
            .input-group input, .login-btn {
                font-size: 13px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="logo">
                <img src="images/logo.png" alt="Ranking Logo">
            </div>
            <h2>로그인</h2>
            <div th:if="${param.error}" class="alert error">
                이메일 또는 비밀번호가 올바르지 않습니다.
            </div>
            <div th:if="${param.logout}" class="alert success">
                로그아웃 되었습니다.
            </div>
            <form th:action="@{/login}" method="post">
                <div class="input-group">
                    <input type="email" name="username" placeholder="이메일">
                </div>
                <div class="input-group password">
                    <input type="password" name="password" placeholder="비밀번호" id="password">
                    <span class="toggle-password" onclick="togglePassword()">👁</span>
                </div>
                <a th:href="@{/password-reset}" class="forgot-password">비밀번호 재설정</a>
                <button type="submit" class="login-btn">로그인</button>
            </form>
            <div class="signup">
                <a th:href="@{/signup}">회원가입</a>
            </div>
            <div class="footer-right">© CubingClubKorea. All Rights Reserved</div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById("password");
            passwordInput.type = passwordInput.type === "password" ? "text" : "password";
        }
    </script>
</body>
</html>
